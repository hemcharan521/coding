<!DOCTYPE html>
<html>
    <head>
        <title>All CSS Color Methods</title>
        <style>
            body {
                font-family: arial, sans-serif;
                padding: 20px;
                font-size: 20px;
            }

            .line1 { color: red; }
            .line2 { color: #00FF00; }
            .line3 { color: #00F; }
            .line4 { color: rgb(255, 165, 0); }
            .line5 { color: rgba(128, 0, 128, 0.9); }
            .line6 { color: hsl(180, 100%, 50%); }
            .line7 { color: hsl(300, 100%, 50%,1); }
        </style>
    </head>
    <body>
        <p class="line1">1. Color Name: red</p>
        <p class="line2">2. Hex (6 digits): #00FF00</p>
        <p class="line3">3. Hex (3 digits): #00F</p>
        <p class="line4">4. RGB: rgb(255, 165, 0)</p>
        <p class="line5">5. RGBA: rgba(128, 0, 128, 0.9)</p>
        <p class="line6">6. HSL: hsl(180, 100%, 50%)</p>
        <p class="line7">7. HSLA: hsla(300, 100%, 50%, 1)</p>
    </body>
</html>
