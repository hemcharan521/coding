<!doctype html>
<html>
  <head>
    <title>nothing</title>
  </head>
  <body>
    <h1 id="decision">default</h1>
    <label>enter rock paper or scissors</label>
    <input id="input1" />
    <button onclick="change()">click</button>
    <script>
      let heading = document.getElementById("decision");
      function change() {
        let variable = document.getElementById("input1").value;
        switch (variable) {
          case "rock":
            heading.textContent = "rock";
            break;
          case "paper":
            heading.textContent = "paper";
            break;
          case "scissors":
            heading.textContent = "scissors";
            break;
          default:
            heading.textContent = "enter valid value ra munda";
        }
      }
    </script>
  </body>
</html>
