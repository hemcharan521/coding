<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
      }
      #box {
        background-color: lightblue;
        width: 300px;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="box">fuck off😊</div>
    <script>
      const box = document.getElementById("box");

      const move = 10;

      let x = 0;
      let y = 0;

      document.addEventListener("keydown", (event) => {
        if (event.key.startsWith("Arrow")) {
          switch (event.key) {
            case "ArrowUp":
              y -= move;
              break;
            case "ArrowDown":
              y += move;
              break;
            case "ArrowLeft":
              x -= move;
              break;
            case "ArrowRight":
              x += move;
          }
          box.style.top = `${y}px`;
          box.style.left = `${x}px`;
        }
      });
    </script>
  </body>
</html>
